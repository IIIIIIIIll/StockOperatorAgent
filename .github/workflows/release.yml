name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# 同一 tag 的重复推送 / 重复 dispatch 不再并行双跑。这里**刻意不取消**:
# release 包含「两次把产物挂到同一个 Release」的动作,已开始的那次跑到一半被杀
# 会留下半发布的 Release(桌面传了、APK 没传),比多跑一次更危险。
# cancel-in-progress: false 的语义 = 同 group 只排队一个待跑者,更早的待跑者被丢弃。
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # CR-43:tag/dispatch 发布前先跑与 ci.yml 相同的门禁——任意 commit 打 tag
  # 都可能直接产出并挂出 Release 产物,不能绕过 typecheck/vitest。
  test:
    name: typecheck + test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: 1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      # A4:desktop lockfile 之前只在 tag 那天的 build job 才第一次被 npm ci
      # (坏掉的 desktop 依赖要等到发版才暴露)。--ignore-scripts 跳过 electron 下载。
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck
      # 2026-11-09 巡检 P1-4:release 与 ci.yml 必须同一道门。根 tsconfig 的
      # include 只有 src/test/tools,app 层对根门完全不可见;expo export 走
      # Babel 转译不做类型检查。历史证据:SDK 57→58 那次 app 层 13 个类型错、CI 全绿。
      - name: Typecheck app
        working-directory: app
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      # S6-3:桌面 Node 后端接线探针(store 落盘/快照/store-op 分派/settings)。
      # 之前它没有任何 npm script 或 workflow 在跑 —— 等于不存在。
      - name: Desktop backend probe
        run: node --experimental-transform-types tools/desktop-probe.mts

      # P2(评审 2026-11-09):原先这段 17 行脚本在 desktop / android 两个 build job
      # 各存一份(改一份漏一份),且都带 `if: tag` → workflow_dispatch 完全跳过核对。
      # 现在收成 test job 里唯一一份,并把根 package.json 也纳入比对。
      - name: Verify versions match release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          verify() {
            local file="$1" actual="$2"
            if [ "$actual" != "$tag_version" ]; then
              echo "Release gate failed: $file is $actual, tag is v${tag_version}" >&2
              echo "Bump $file to ${tag_version} and re-tag, or delete this tag and create v${tag_version}." >&2
              exit 1
            fi
            echo "OK: $file ${actual}"
          }
          verify "package.json"            "$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          verify "desktop/package.json"    "$(node -p "JSON.parse(require('fs').readFileSync('desktop/package.json','utf8')).version")"
          verify "app/package.json"        "$(node -p "JSON.parse(require('fs').readFileSync('app/package.json','utf8')).version")"
          verify "app/app.json"            "$(node -p "JSON.parse(require('fs').readFileSync('app/app.json','utf8')).expo.version")"

  desktop:
    name: desktop (${{ matrix.os }})
    needs: test
    # P2(评审 2026-11-09):显式声明,不再隐式继承顶层 write。发布动作在本 job 内
    # (softprops 直接改 release),故仍需 contents: write —— 彻底收窄要把发布拆到
    # 独立 publish job,属结构改动,留待与 B6 重构一起做。
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CI: 1
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 → 11d5960a326750d5838078e36cf38b85af677262
        with:
          # S8-5:构建 job 不需要凭据;避免 token 落进 .git/config 随 artifact 出去
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 → 49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          # 默认走 runner 预缓存版本(2026-10-21 实测 v22.23.3,仍低于
          # 10 月安全版的 22.23.4);check-latest 才会查 node-versions 清单。
          check-latest: true
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            desktop/package-lock.json


      - name: Install root production dependencies
        run: npm ci --omit=dev

      - name: Build web bundle (expo export)
        working-directory: app
        run: |
          npm ci
          npx expo export --platform web
          node ../tools/restore-app-tsconfig.mjs

      - name: Package desktop installers (electron-builder)
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --publish never

      # 复核 §0 遗留(VERIFIED):三个 OS 都上传 .exe/.dmg/.AppImage,但断言只有
      # Linux 那两步(if: runner.os == 'Linux')。Windows/macOS 是「打包命令没报错
      # 就算过」—— electron-builder 的 target 配错时会静默跳过该 target,结果是
      # 一个空 dist 目录 + 一次全绿的发版。这里补一道与 OS 无关的产物断言。
      - name: Assert installer artifact produced (all OSes)
        shell: bash
        run: |
          case "${RUNNER_OS}" in
            Linux)   glob='desktop/dist/*.AppImage' ;;
            Windows) glob='desktop/dist/*.exe' ;;
            macOS)   glob='desktop/dist/*.dmg' ;;
            *) echo "::error::未知 RUNNER_OS=${RUNNER_OS}"; exit 1 ;;
          esac
          shopt -s nullglob
          files=( $glob )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::${RUNNER_OS} 没产出匹配 ${glob} 的安装包(electron-builder target 配错?)"
            ls -la desktop/dist || true
            exit 1
          fi
          min=$((20 * 1024 * 1024))
          for f in "${files[@]}"; do
            size=$(wc -c < "$f" | tr -d ' ')
            echo "${f}: ${size} 字节"
            if [ "$size" -lt "$min" ]; then
              echo "::error::${f} 过小(${size} < ${min}),可能是空壳产物"
              exit 1
            fi
          done
          echo "OK: ${RUNNER_OS} 安装包齐备(共 ${#files[@]} 个)"
          # 非 Linux 的资源树只打不判:layout 未在本仓库真机验证过,
          # 不拿猜测的路径去硬失败发版链路(平匀失败只剩日志可查)。
          if [ "${RUNNER_OS}" != "Linux" ]; then
            echo '--- dist 资源树(仅供参考) ---'
            find desktop/dist -maxdepth 3 -name resources -o -maxdepth 2 -type d | head -20 || true
          fi

      # B2:打包成功 ≠ 能启动。electron-builder 的「漏列入口文件」只有在用户
      # 装完启动那刻才暴露(desktop-ci spec 的已知坑)。这里断言 resources/ 下
      # 确实躺着 child 需要的每个入口 —— 确定性检查,不需要 GUI/xvfb。
      - name: Packaged tree smoke (entry files present)
        if: runner.os == 'Linux'
        working-directory: desktop
        run: |
          # 实际布局(electron-builder --dir 实测):asar:false 时入口在
          # resources/app/,node_modules 与 src 在 resources/ 根
          # (→ child.mjs 的 '../app/server.mjs'、'../src/*' 才成立)。
          root=dist/linux-unpacked/resources
          missing=0
          for f in app/main.mjs app/child.mjs app/preload.cjs app/server.mjs \
                   app/lib/proxies.cjs app/lib/logs-server.cjs app/dist/index.html \
                   src/store-node.ts src/store.ts package.json \
                   node_modules/@langchain/core/package.json; do
            if [ ! -e "$root/$f" ]; then
              echo "MISSING: resources/$f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { echo "packaged tree incomplete"; exit 1; }
          echo "OK: packaged tree has every entry file"

      # 打包产物启动烟测(需要 X 才能建窗口;GH runner 可装 xvfb)。
      # 判据用 main.mjs 自己的日志,不用 --version(那会走 Chromium 的快速退出路径):
      # 出现 `[main] child ready: http://127.0.0.1:…` 或 `[renderer:` 即算真起来了。
      - name: Packaged app launch smoke
        if: runner.os == 'Linux'
        working-directory: desktop
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          # 同目录还有 chrome-sandbox / crashpad helper / *.so,按名字与后缀排除
          exe=$(find dist/linux-unpacked -maxdepth 1 -type f -perm -u+x \
                  ! -name '*.so*' ! -name 'chrome*' | head -1)
          echo "binary: $exe"
          xvfb-run -a -s "-screen 0 1280x800x24" \
            "$exe" --no-sandbox --disable-gpu > /tmp/soa-app.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 40); do
            if grep -qE "child ready|\[renderer:" /tmp/soa-app.log; then ok=1; break; fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          if [ "$ok" -eq 1 ] && ! grep -q "child exited unexpectedly" /tmp/soa-app.log; then
            echo "OK: packaged app reached a running state"
            head -20 /tmp/soa-app.log
          else
            echo "app never reached a running state:"
            cat /tmp/soa-app.log
            exit 1
          fi

      - name: Upload to GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 → 3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.dmg
          body: |
            本 Release 由 tag `${{ github.ref_name }}` 自动构建，挂载桌面安装包与 Android APK。

            ## 安装与签名提示

            - **Windows**：`StockOperatorAgent-Setup-<version>.exe`（NSIS 安装包）。产物未签名，SmartScreen 可能提示“未知发布者”，选择“更多信息 → 仍要运行”即可。
            - **macOS**：`StockOperatorAgent-<version>-<arch>.dmg`。产物未签名/未公证，首次打开会触发 Gatekeeper“无法验证开发者”，需在“系统设置 → 隐私与安全性”中手动允许。
            - **Linux**：`StockOperatorAgent-<version>-<arch>.AppImage`（`chmod +x` 后运行）与 `.deb`（`sudo dpkg -i` 安装）。
            - **Android**：`soa-<version>.apk` 可直接安装；`soa-<version>.aab` 为 Google Play 提交包（Play App Signing 会以同一上传密钥自动签名分发）。未配置签名 Secrets 时为 debug 签名（可安装、仅供自测），配置后自动改为正式签名。

            完整发版步骤、产物清单与签名配置见仓库 README「发布」章节。

      - name: Upload build artifacts (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 → ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-${{ matrix.os }}
          # S6-3:零产物是失败信号,不再 ignore
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.dmg

  android:
    name: android (apk)
    needs: test
    # 同 desktop:发布动作在本 job 内,故需要 contents: write(见上方说明)。
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      CI: 1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 → 11d5960a326750d5838078e36cf38b85af677262
        with:
          # S8-5:构建 job 不需要凭据;避免 token 落进 .git/config 随 artifact 出去
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 → 49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          # 默认走 runner 预缓存版本(2026-10-21 实测 v22.23.3,仍低于
          # 10 月安全版的 22.23.4);check-latest 才会查 node-versions 清单。
          check-latest: true
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json


      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4 → cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Install root production dependencies
        run: npm ci --omit=dev

      # S6-1:versionCode 由版本号确定性推导(major*10000+minor*100+patch),
      # 不再是手改字面量 —— 忘 bump 会在 Play 上传时被拒。必须在 prebuild 之前,
      # 因为 gradle 的 versionCode 由 app.json 生成。
      - name: Derive Android versionCode from tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: node tools/derive-version-code.mjs "${GITHUB_REF_NAME#v}"

      - name: Install app dependencies and prebuild Android project
        working-directory: app
        run: |
          npm ci
          npx expo prebuild --platform android --no-install

      - name: Configure Android release signing (keystore secrets)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node tools/configure-android-signing.mjs

      - name: Build release APK + AAB
        working-directory: app/android
        env:
          GRADLE_OPTS: "-Xmx3g"
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon -x lint

      - name: Rename APK to soa-<version>.apk
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp "app/android/app/build/outputs/apk/release/app-release.apk" "soa-${version}.apk"

      - name: Rename AAB to soa-<version>.aab
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp "app/android/app/build/outputs/bundle/release/app-release.aab" "soa-${version}.aab"

      # 复核 §0 遗留(VERIFIED):此前 CI 从不校验签名。tools/configure-android-signing.mjs
      # 在缺 ANDROID_KEYSTORE_B64 时只打一行提示就 exit(0),APK 静默降级成 debug
      # 签名 —— 可安装、可自测,发出去也没人拦。v0.1.12 是人工拿 apksigner 验的
      # (CN=SOA Release 正式签名),但只要 Secrets 哪天没配,回归就没人发现。
      - name: Verify APK signature (apksigner)
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner=$(ls -d "$sdk"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ ! -x "$apksigner" ]; then
            echo "::error::找不到 apksigner($sdk/build-tools/*/),runner 镜像的 Android SDK 布局变了?"
            exit 1
          fi
          echo "apksigner: $apksigner"
          soa_apk=$(ls soa-*.apk | head -1)
          certs=$("$apksigner" verify --print-certs "$soa_apk")
          echo "$certs"
          if grep -q 'CN=Android Debug' <<<"$certs"; then
            echo "::warning::APK 使用 debug 签名(ANDROID_KEYSTORE_B64 未配置?)"
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "::error::tag 发布不得产 debug 签名的 APK —— 配好四个签名 Secrets 后重打 tag"
              exit 1
            fi
          else
            echo "OK: $soa_apk 已用正式证书签名"
          fi

      # AAB 侧对称检查:Play 上传包同样不能无签名(上传密钥就是这里的 keystore)。
      - name: Verify AAB signature (jarsigner)
        run: |
          soa_aab=$(ls soa-*.aab | head -1)
          jarsigner -verify "$soa_aab" | tail -5
          echo "OK: $soa_aab 已签名"

      - name: Upload APK/AAB to GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 → 3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          # P2(评审 2026-11-09):不再各写一份 body —— 两个 job 同时发布同一 tag,
          # action-gh-release 会改动既有 release,后完成者的 body 覆盖前者,发布说明
          # 变成"看哪个 job 先跑完"。正文统一由 desktop job 提供(已含 .aab 段)。
          files: |
            soa-*.apk
            soa-*.aab

      - name: Upload APK/AAB artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 → ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: soa-android
          path: |
            soa-*.apk
            soa-*.aab
