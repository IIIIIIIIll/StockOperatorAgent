name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CI: 1
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 → 11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 → 49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            desktop/package-lock.json

      - name: Verify desktop version matches release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "JSON.parse(require('fs').readFileSync('desktop/package.json','utf8')).version")"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "Release gate failed: desktop/package.json version does not match tag version"
            echo "expected: v${tag_version}"
            echo "actual:   ${pkg_version}"
            echo "Bump desktop/package.json to ${tag_version} and re-tag, or delete this tag and create v${pkg_version}."
            exit 1
          fi
          echo "Release gate OK: desktop/package.json ${pkg_version} matches tag v${tag_version}"

      - name: Install root production dependencies
        run: npm ci --omit=dev

      - name: Build web bundle (expo export)
        working-directory: app
        run: |
          npm ci
          npx expo export --platform web

      - name: Package desktop installers (electron-builder)
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --publish never

      - name: Upload to GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 → 3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.dmg
          body: |
            本 Release 由 tag `${{ github.ref_name }}` 自动构建，挂载桌面安装包与 Android APK。

            ## 安装与签名提示

            - **Windows**：`StockOperatorAgent-Setup-<version>.exe`（NSIS 安装包）。产物未签名，SmartScreen 可能提示“未知发布者”，选择“更多信息 → 仍要运行”即可。
            - **macOS**：`StockOperatorAgent-<version>-<arch>.dmg`。产物未签名/未公证，首次打开会触发 Gatekeeper“无法验证开发者”，需在“系统设置 → 隐私与安全性”中手动允许。
            - **Linux**：`StockOperatorAgent-<version>-<arch>.AppImage`（`chmod +x` 后运行）与 `.deb`（`sudo dpkg -i` 安装）。
            - **Android**：`soa-<version>.apk` 可直接安装；未配置签名 Secrets 时为 debug 签名（可安装、仅供自测），配置后自动改为正式签名。

            完整发版步骤、产物清单与签名配置见仓库 README「发布」章节。

      - name: Upload build artifacts (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 → ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.dmg

  android:
    name: android (apk)
    runs-on: ubuntu-latest
    env:
      CI: 1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 → 11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 → 49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Verify desktop and android versions match release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "JSON.parse(require('fs').readFileSync('desktop/package.json','utf8')).version")"
          app_pkg_version="$(node -p "JSON.parse(require('fs').readFileSync('app/package.json','utf8')).version")"
          app_json_version="$(node -p "JSON.parse(require('fs').readFileSync('app/app.json','utf8')).expo.version")"
          if [ "$pkg_version" != "$tag_version" ] || [ "$app_pkg_version" != "$tag_version" ] || [ "$app_json_version" != "$tag_version" ]; then
            echo "Release gate failed: desktop/app version does not match tag version"
            echo "expected:             v${tag_version}"
            echo "desktop/package.json: ${pkg_version}"
            echo "app/package.json:     ${app_pkg_version}"
            echo "app/app.json:         ${app_json_version}"
            echo "Bump desktop/package.json, app/package.json and app/app.json to ${tag_version} and re-tag, or delete this tag and create v${tag_version}."
            exit 1
          fi
          echo "Release gate OK: desktop/package.json ${pkg_version}, app/package.json ${app_pkg_version}, app/app.json ${app_json_version} match tag v${tag_version}"

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4 → cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Install root production dependencies
        run: npm ci --omit=dev

      - name: Install app dependencies and prebuild Android project
        working-directory: app
        run: |
          npm ci
          npx expo prebuild --platform android --no-install

      - name: Configure Android release signing (keystore secrets)
        run: node tools/configure-android-signing.mjs

      - name: Build release APK + AAB
        working-directory: app/android
        env:
          GRADLE_OPTS: "-Xmx3g"
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon -x lint

      - name: Rename APK to soa-<version>.apk
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp "app/android/app/build/outputs/apk/release/app-release.apk" "soa-${version}.apk"

      - name: Rename AAB to soa-<version>.aab
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp "app/android/app/build/outputs/bundle/release/app-release.aab" "soa-${version}.aab"

      - name: Upload APK/AAB to GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 → 3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            soa-*.apk
            soa-*.aab
          body: |
            本 Release 由 tag `${{ github.ref_name }}` 自动构建，挂载桌面安装包与 Android APK。

            ## 安装与签名提示

            - **Windows**：`StockOperatorAgent-Setup-<version>.exe`（NSIS 安装包）。产物未签名，SmartScreen 可能提示“未知发布者”，选择“更多信息 → 仍要运行”即可。
            - **macOS**：`StockOperatorAgent-<version>-<arch>.dmg`。产物未签名/未公证，首次打开会触发 Gatekeeper“无法验证开发者”，需在“系统设置 → 隐私与安全性”中手动允许。
            - **Linux**：`StockOperatorAgent-<version>-<arch>.AppImage`（`chmod +x` 后运行）与 `.deb`（`sudo dpkg -i` 安装）。
            - **Android**：`soa-<version>.apk` 可直接安装；`soa-<version>.aab` 为 Google Play 提交包（Play App Signing 会以同一上传密钥自动签名分发，上传 Play 时使用）。未配置签名 Secrets 时为 debug 签名（可安装、仅供自测），配置后自动改为正式签名。

            完整发版步骤、产物清单与签名配置见仓库 README「发布」章节。

      - name: Upload APK/AAB artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 → ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: soa-android
          path: |
            soa-*.apk
            soa-*.aab
