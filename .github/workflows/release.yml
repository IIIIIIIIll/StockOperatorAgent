name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # CR-43:tag/dispatch 发布前先跑与 ci.yml 相同的门禁——任意 commit 打 tag
  # 都可能直接产出并挂出 Release 产物,不能绕过 typecheck/vitest。
  test:
    name: typecheck + test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: 1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      # A4:desktop lockfile 之前只在 tag 那天的 build job 才第一次被 npm ci
      # (坏掉的 desktop 依赖要等到发版才暴露)。--ignore-scripts 跳过 electron 下载。
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck
      # 2026-11-09 巡检 P1-4:release 与 ci.yml 必须同一道门。根 tsconfig 的
      # include 只有 src/test/tools,app 层对根门完全不可见;expo export 走
      # Babel 转译不做类型检查。历史证据:SDK 57→58 那次 app 层 13 个类型错、CI 全绿。
      - name: Typecheck app
        working-directory: app
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      # S6-3:桌面 Node 后端接线探针(store 落盘/快照/store-op 分派/settings)。
      # 之前它没有任何 npm script 或 workflow 在跑 —— 等于不存在。
      - name: Desktop backend probe
        run: node --experimental-transform-types tools/desktop-probe.mts

  desktop:
    name: desktop (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CI: 1
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 → 11d5960a326750d5838078e36cf38b85af677262
        with:
          # S8-5:构建 job 不需要凭据;避免 token 落进 .git/config 随 artifact 出去
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 → 49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          # 默认走 runner 预缓存版本(2026-10-21 实测 v22.23.3,仍低于
          # 10 月安全版的 22.23.4);check-latest 才会查 node-versions 清单。
          check-latest: true
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            desktop/package-lock.json

      - name: Verify desktop and android versions match release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "JSON.parse(require('fs').readFileSync('desktop/package.json','utf8')).version")"
          app_pkg_version="$(node -p "JSON.parse(require('fs').readFileSync('app/package.json','utf8')).version")"
          app_json_version="$(node -p "JSON.parse(require('fs').readFileSync('app/app.json','utf8')).expo.version")"
          if [ "$pkg_version" != "$tag_version" ] || [ "$app_pkg_version" != "$tag_version" ] || [ "$app_json_version" != "$tag_version" ]; then
            echo "Release gate failed: desktop/app version does not match tag version"
            echo "expected:             v${tag_version}"
            echo "desktop/package.json: ${pkg_version}"
            echo "app/package.json:     ${app_pkg_version}"
            echo "app/app.json:         ${app_json_version}"
            echo "Bump desktop/package.json, app/package.json and app/app.json to ${tag_version} and re-tag, or delete this tag and create v${tag_version}."
            exit 1
          fi
          echo "Release gate OK: desktop/package.json ${pkg_version}, app/package.json ${app_pkg_version}, app/app.json ${app_json_version} match tag v${tag_version}"

      - name: Install root production dependencies
        run: npm ci --omit=dev

      - name: Build web bundle (expo export)
        working-directory: app
        run: |
          npm ci
          npx expo export --platform web
          node ../tools/restore-app-tsconfig.mjs

      - name: Package desktop installers (electron-builder)
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --publish never

      # B2:打包成功 ≠ 能启动。electron-builder 的「漏列入口文件」只有在用户
      # 装完启动那刻才暴露(desktop-ci spec 的已知坑)。这里断言 resources/ 下
      # 确实躺着 child 需要的每个入口 —— 确定性检查,不需要 GUI/xvfb。
      - name: Packaged tree smoke (entry files present)
        if: runner.os == 'Linux'
        working-directory: desktop
        run: |
          # 实际布局(electron-builder --dir 实测):asar:false 时入口在
          # resources/app/,node_modules 与 src 在 resources/ 根
          # (→ child.mjs 的 '../app/server.mjs'、'../src/*' 才成立)。
          root=dist/linux-unpacked/resources
          missing=0
          for f in app/main.mjs app/child.mjs app/preload.cjs app/server.mjs \
                   app/lib/proxies.cjs app/lib/logs-server.cjs app/dist/index.html \
                   src/store-node.ts src/store.ts package.json \
                   node_modules/@langchain/core/package.json; do
            if [ ! -e "$root/$f" ]; then
              echo "MISSING: resources/$f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { echo "packaged tree incomplete"; exit 1; }
          echo "OK: packaged tree has every entry file"

      # 打包产物启动烟测(需要 X 才能建窗口;GH runner 可装 xvfb)。
      # 判据用 main.mjs 自己的日志,不用 --version(那会走 Chromium 的快速退出路径):
      # 出现 `[main] child ready: http://127.0.0.1:…` 或 `[renderer:` 即算真起来了。
      - name: Packaged app launch smoke
        if: runner.os == 'Linux'
        working-directory: desktop
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          # 同目录还有 chrome-sandbox / crashpad helper / *.so,按名字与后缀排除
          exe=$(find dist/linux-unpacked -maxdepth 1 -type f -perm -u+x \
                  ! -name '*.so*' ! -name 'chrome*' | head -1)
          echo "binary: $exe"
          xvfb-run -a -s "-screen 0 1280x800x24" \
            "$exe" --no-sandbox --disable-gpu > /tmp/soa-app.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 40); do
            if grep -qE "child ready|\[renderer:" /tmp/soa-app.log; then ok=1; break; fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          if [ "$ok" -eq 1 ] && ! grep -q "child exited unexpectedly" /tmp/soa-app.log; then
            echo "OK: packaged app reached a running state"
            head -20 /tmp/soa-app.log
          else
            echo "app never reached a running state:"
            cat /tmp/soa-app.log
            exit 1
          fi

      - name: Upload to GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 → 3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.dmg
          body: |
            本 Release 由 tag `${{ github.ref_name }}` 自动构建，挂载桌面安装包与 Android APK。

            ## 安装与签名提示

            - **Windows**：`StockOperatorAgent-Setup-<version>.exe`（NSIS 安装包）。产物未签名，SmartScreen 可能提示“未知发布者”，选择“更多信息 → 仍要运行”即可。
            - **macOS**：`StockOperatorAgent-<version>-<arch>.dmg`。产物未签名/未公证，首次打开会触发 Gatekeeper“无法验证开发者”，需在“系统设置 → 隐私与安全性”中手动允许。
            - **Linux**：`StockOperatorAgent-<version>-<arch>.AppImage`（`chmod +x` 后运行）与 `.deb`（`sudo dpkg -i` 安装）。
            - **Android**：`soa-<version>.apk` 可直接安装；未配置签名 Secrets 时为 debug 签名（可安装、仅供自测），配置后自动改为正式签名。

            完整发版步骤、产物清单与签名配置见仓库 README「发布」章节。

      - name: Upload build artifacts (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 → ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-${{ matrix.os }}
          # S6-3:零产物是失败信号,不再 ignore
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.dmg

  android:
    name: android (apk)
    needs: test
    runs-on: ubuntu-latest
    env:
      CI: 1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 → 11d5960a326750d5838078e36cf38b85af677262
        with:
          # S8-5:构建 job 不需要凭据;避免 token 落进 .git/config 随 artifact 出去
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 → 49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          # 默认走 runner 预缓存版本(2026-10-21 实测 v22.23.3,仍低于
          # 10 月安全版的 22.23.4);check-latest 才会查 node-versions 清单。
          check-latest: true
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Verify desktop and android versions match release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "JSON.parse(require('fs').readFileSync('desktop/package.json','utf8')).version")"
          app_pkg_version="$(node -p "JSON.parse(require('fs').readFileSync('app/package.json','utf8')).version")"
          app_json_version="$(node -p "JSON.parse(require('fs').readFileSync('app/app.json','utf8')).expo.version")"
          if [ "$pkg_version" != "$tag_version" ] || [ "$app_pkg_version" != "$tag_version" ] || [ "$app_json_version" != "$tag_version" ]; then
            echo "Release gate failed: desktop/app version does not match tag version"
            echo "expected:             v${tag_version}"
            echo "desktop/package.json: ${pkg_version}"
            echo "app/package.json:     ${app_pkg_version}"
            echo "app/app.json:         ${app_json_version}"
            echo "Bump desktop/package.json, app/package.json and app/app.json to ${tag_version} and re-tag, or delete this tag and create v${tag_version}."
            exit 1
          fi
          echo "Release gate OK: desktop/package.json ${pkg_version}, app/package.json ${app_pkg_version}, app/app.json ${app_json_version} match tag v${tag_version}"

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4 → cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Install root production dependencies
        run: npm ci --omit=dev

      # S6-1:versionCode 由版本号确定性推导(major*10000+minor*100+patch),
      # 不再是手改字面量 —— 忘 bump 会在 Play 上传时被拒。必须在 prebuild 之前,
      # 因为 gradle 的 versionCode 由 app.json 生成。
      - name: Derive Android versionCode from tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: node tools/derive-version-code.mjs "${GITHUB_REF_NAME#v}"

      - name: Install app dependencies and prebuild Android project
        working-directory: app
        run: |
          npm ci
          npx expo prebuild --platform android --no-install

      - name: Configure Android release signing (keystore secrets)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node tools/configure-android-signing.mjs

      - name: Build release APK + AAB
        working-directory: app/android
        env:
          GRADLE_OPTS: "-Xmx3g"
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon -x lint

      - name: Rename APK to soa-<version>.apk
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp "app/android/app/build/outputs/apk/release/app-release.apk" "soa-${version}.apk"

      - name: Rename AAB to soa-<version>.aab
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp "app/android/app/build/outputs/bundle/release/app-release.aab" "soa-${version}.aab"

      - name: Upload APK/AAB to GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 → 3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            soa-*.apk
            soa-*.aab
          body: |
            本 Release 由 tag `${{ github.ref_name }}` 自动构建，挂载桌面安装包与 Android APK。

            ## 安装与签名提示

            - **Windows**：`StockOperatorAgent-Setup-<version>.exe`（NSIS 安装包）。产物未签名，SmartScreen 可能提示“未知发布者”，选择“更多信息 → 仍要运行”即可。
            - **macOS**：`StockOperatorAgent-<version>-<arch>.dmg`。产物未签名/未公证，首次打开会触发 Gatekeeper“无法验证开发者”，需在“系统设置 → 隐私与安全性”中手动允许。
            - **Linux**：`StockOperatorAgent-<version>-<arch>.AppImage`（`chmod +x` 后运行）与 `.deb`（`sudo dpkg -i` 安装）。
            - **Android**：`soa-<version>.apk` 可直接安装；`soa-<version>.aab` 为 Google Play 提交包（Play App Signing 会以同一上传密钥自动签名分发，上传 Play 时使用）。未配置签名 Secrets 时为 debug 签名（可安装、仅供自测），配置后自动改为正式签名。

            完整发版步骤、产物清单与签名配置见仓库 README「发布」章节。

      - name: Upload APK/AAB artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 → ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: soa-android
          path: |
            soa-*.apk
            soa-*.aab
