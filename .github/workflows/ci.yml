# CI 测试门:typecheck + vitest(push master / PR)。
# push 必须 branches 过滤:裸 on:push 对 tag push 同样触发,v* tag 推送会与
# release.yml 并行双跑(审计裁定);branch 过滤天然排除 tag ref。
# 可选增强(本轮不做,防遗忘):app 层 tsc、expo export 编译门——app 用独立
# tsconfig(Expo SDK 模板钉版 typescript ~6.0.3,见 app/package.json 注释),与根
# 门(TS 7)互不兼容;发布链路(release.yml)的 expo export 已兜底编译 app 层。
name: ci

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: typecheck + test
    runs-on: ubuntu-latest
    env:
      CI: 1
    steps:
      # Pin 注释上提一行:保留 SHA 溯源且不让 yml 超长。
      # actions/checkout v4 → 11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # ci 只跑 npm ci + typecheck + test,不需要 git 凭据;避免 token
          # 落在 .git/config 并被后续 artifact 带上(zizmor artipacked)。
          persist-credentials: false

      # actions/setup-node v4 → 49933ea5288caeca8642d1e84afbd3f7d6820020
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 根 vitest 会 transform app/lib/*.ts(如 analysis-controller.test.ts),
      # 而 app/tsconfig.json extends "expo/tsconfig.base"——缺 app/node_modules
      # 时 oxc 报 TSCONFIG_ERROR: Failed to load tsconfig 'expo/tsconfig.base',
      # 13 个 test file 直接 transform 失败(2026-10-21 实证)。必须装 app 层。
      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
