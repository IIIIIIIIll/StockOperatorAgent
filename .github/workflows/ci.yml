# CI 测试门:typecheck + vitest(push master / PR)。
# push 必须 branches 过滤:裸 on:push 对 tag push 同样触发,v* tag 推送会与
# release.yml 并行双跑(审计裁定);branch 过滤天然排除 tag ref。
# 可选增强(本轮不做,防遗忘):app 层 tsc、expo export 编译门——app 用独立
# tsconfig(Expo SDK 模板钉版 typescript ~6.0.3,见 app/package.json 注释),与根
# 门(TS 7)互不兼容;发布链路(release.yml)的 expo export 已兜底编译 app 层。
name: ci

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: typecheck + test
    runs-on: ubuntu-latest
    env:
      CI: 1
    steps:
      # Pin 注释上提一行:保留 SHA 溯源且不让 yml 超长。
      # actions/checkout v4 → 11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # ci 只跑 npm ci + typecheck + test,不需要 git 凭据;避免 token
          # 落在 .git/config 并被后续 artifact 带上(zizmor artipacked)。
          persist-credentials: false

      # actions/setup-node v4 → 49933ea5288caeca8642d1e84afbd3f7d6820020
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          # 默认走 runner 预缓存版本(2026-10-21 实测 v22.23.3,仍低于
          # 10 月安全版的 22.23.4);check-latest 才会查 node-versions 清单。
          check-latest: true
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            desktop/package-lock.json
          # S6-4:desktop lockfile 之前既不在缓存键里、CI 也从不 npm ci 它 ——
          # 坏掉的 desktop 依赖只会在打 tag 那天暴露。

      - name: Install dependencies
        run: npm ci

      # 根 vitest 会 transform app/lib/*.ts(如 analysis-controller.test.ts),
      # 而 app/tsconfig.json extends "expo/tsconfig.base"——缺 app/node_modules
      # 时 oxc 报 TSCONFIG_ERROR: Failed to load tsconfig 'expo/tsconfig.base',
      # 13 个 test file 直接 transform 失败(2026-10-21 实证)。必须装 app 层。
      - name: Install app dependencies
        working-directory: app
        run: npm ci

      # A2(2026-11-08 实证):app 层有独立 tsconfig 与 RN/Expo 类型,根门看不到。
      # SDK 57→58 那次升级,app 层 13 个类型错、CI 全绿 —— 就是这条缺口。
      - name: Typecheck app
        working-directory: app
        run: npx tsc --noEmit

      - name: Typecheck
        run: npm run typecheck

      # P2(评审 2026-11-09):app/lib/chartHtml.ts 是提交进仓库的生成物,运行时被
      # useChartWebView 直接喂给 WebView。此前没有任何 workflow 跑 chart:check ——
      # 改了 tools/build-chart-view.mts 却不重新生成,会把陈旧 HTML 发出去且全绿。
      - name: Chart view guard (generated file in sync)
        run: npm run chart:check --prefix app

      - name: Validate desktop lockfile
        working-directory: desktop
        # S6-4:--ignore-scripts 跳过 electron 二进制下载(~100MB),只校验 lockfile
        # 与依赖图;probe 不需要 electron 本身。
        run: npm ci --ignore-scripts

      # A2:打包门 —— 版本错配在类型层未必显形,expo export 一定炸。
      # 收尾还原 app/tsconfig.json(expo export 会把它改写成 extends 形,CR-04)。
      - name: Build web bundle
        working-directory: app
        run: |
          npx expo export --platform web
          node ../tools/restore-app-tsconfig.mjs

      # 2026-11-09 巡检 P1-5:expo export 只证明「能编译」,挂载即抛的 bundle
      # 一样绿。web-e2e.mjs 需要 app/dist(上一步刚好产出),ubuntu-latest 自带
      # /usr/bin/google-chrome(脚本默认路径),零额外依赖。
      - name: Web e2e smoke
        run: npm run e2e:web

      - name: Test
        run: npm test

      # S6-3:桌面 Node 后端接线探针(此前无任何 npm script/workflow 在跑)。
      - name: Desktop backend probe
        run: node --experimental-transform-types tools/desktop-probe.mts
