apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

group = 'expo.modules.soakeepalive'
version = '1.0.0'

// SDK 58 起 expo-modules-core 要求 compileSdk 37;写死 35 会让
// :soa-keepalive:checkReleaseAarMetadata 直接失败(2026-11-08 v0.1.11 发版实跑)。
// 跟随根项目(与 expo 官方 module 模板同一套 safeExtGet),回退值对齐 SDK 58。
def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace 'expo.modules.soakeepalive'
  compileSdkVersion safeExtGet('compileSdkVersion', 37)
  defaultConfig {
    minSdkVersion safeExtGet('minSdkVersion', 24)
    targetSdkVersion safeExtGet('targetSdkVersion', 37)
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation project(':expo-modules-core')
}
