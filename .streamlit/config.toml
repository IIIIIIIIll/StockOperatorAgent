# Streamlit 主题配置(08-05-ui-dark-mode-theme)
#
# 亮/暗两套独立色板(1.51.0 引入的 [theme.light]/[theme.dark] 分主题表,
# 环境基线 streamlit 1.61.1)。初始主题跟随系统偏好,用户可在 Settings
# 菜单切换并持久(1.54+ 含 #13306 持久化修复)。
#
# 色板取值与 core/ui/theme.py 的 PALETTE 同源(人工保持一致,
# test/core/ui/test_theme.py 钉死一致性,防漂移)。
# 品牌色取 A 股语境红色:亮色 #D32F2F(白底对比 4.6:1)、暗色 #EF5350
# (暗底可读);中性色沿用 Streamlit 官方默认(验证过的可读性)。

[theme]
base = "light"
font = "sans-serif"

[theme.light]
primaryColor = "#D32F2F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F7F8"
textColor = "#31333F"
baseRadius = "0.5rem"

[theme.dark]
primaryColor = "#EF5350"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#262730"
textColor = "#FAFAFA"
baseRadius = "0.5rem"
